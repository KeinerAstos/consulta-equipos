services:
  - type: web
    name: consulta-equipos
    env: python

    buildCommand: |
      apt-get update
      apt-get install -y wget unzip gnupg
      wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
      apt-get install -y ./google-chrome-stable_current_amd64.deb
      CHROME_VERSION=$(google-chrome --version | awk '{print $3}' | cut -d. -f1)
      wget -q "https://chromedriver.storage.googleapis.com/${CHROME_VERSION}.0.0/chromedriver_linux64.zip"
      unzip chromedriver_linux64.zip
      mv chromedriver /usr/local/bin/chromedriver
      chmod +x /usr/local/bin/chromedriver

    startCommand: |
      gunicorn index:app --bind 0.0.0.0:$PORT --workers 1 --timeout 200
