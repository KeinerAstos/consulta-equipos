<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>Reasignación de Equipos</title>

<style>

body{
font-family: Arial;
padding:30px;
background:#f4f6f9;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 2px 5px rgba(0,0,0,0.08);
}

.row{
display:flex;
gap:15px;
margin-bottom:15px;
}

.row input,.row select{
flex:1;
padding:8px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

th{
background:#f1f1f1;
}

button{
padding:8px 12px;
cursor:pointer;
border-radius:6px;
border:none;
}

.btn-add{background:#28a745;color:white}
.btn-remove{background:#dc3545;color:white}
.btn-save{background:#007bff;color:white;width:100%;padding:12px;font-weight:bold}

.autocomplete-box{
position:absolute;
background:white;
border:1px solid #ccc;
width:100%;
max-height:150px;
overflow-y:auto;
z-index:999;
}

.autocomplete-item{
padding:6px;
cursor:pointer;
}

.autocomplete-item:hover{
background:#eee;
}

.input-container{
position:relative;
}

.fila-ok{background:#e8fff1}
.fila-error{background:#ffe8e8}

</style>

</head>

<body>

<a href="/tablero_stock">TABLERO DE EXISTENCIAS EN BODEGA</a>

<form method="POST" action="/guardar_reasignacion">

<div class="card">

<h3>Datos Generales</h3>

<div class="row">

<select name="bodega" id="bodega" onchange="llenarCentro()" required>
<option value="">Seleccione Bodega</option>
<option value="BOGOTA">BOGOTA</option>
<option value="CALI">CALI</option>
<option value="BARRANQUILLA">BARRANQUILLA</option>
</select>

<select name="almacen" required>
<option value="">Almacén</option>
<option value="Q500">Q500</option>
<option value="A500">A500</option>
<option value="U032">U032</option>
</select>

<input type="text" id="centro" name="centro" placeholder="Centro" readonly>

</div>

<div class="row">
<input type="text" name="otp_nueva" placeholder="OTP Nueva" required>
<input type="text" name="oth_nueva" placeholder="OTH Nueva">
<input type="text" name="nuevo_cliente" placeholder="Nuevo Cliente" required>
</div>

<div class="row">
<input type="text" name="tipo_ot" placeholder="Tipo de OT" required>
<input type="date" name="fecha_cambio" required>
</div>

</div>

<div class="card">

<h3>Equipos a Reasignar</h3>

<table id="tablaEquipos">

<thead>
<tr>
<th>SAP</th>
<th>Serial</th>
<th>OTP Actual</th>
<th>Acción</th>
</tr>
</thead>

<tbody>

<tr>

<td>

<div class="input-container">

<input name="sap[]" oninput="buscarSAP(this)" autocomplete="off">

<div class="autocomplete-box"></div>

</div>

</td>

<td>

<div class="input-container">

<input name="serial[]" oninput="buscarSerial(this)" onchange="consultarSerial(this)" autocomplete="off">

<div class="autocomplete-box"></div>

</div>

</td>

<td>
<input type="text" name="otp_actual[]" class="otp-actual" readonly>
</td>

<td>
<button type="button" class="btn-remove" onclick="eliminarFila(this)">X</button>
</td>

</tr>

</tbody>

</table>

<br>

<button type="button" class="btn-add" onclick="agregarFila()">Agregar Equipo +</button>

</div>

<button type="submit" class="btn-save">Guardar Reasignación</button>

</form>

<script>

function agregarFila(){

let tabla=document.querySelector("#tablaEquipos tbody")

let fila=tabla.insertRow()

fila.innerHTML=`
<td>
<div class="input-container">
<input name="sap[]" oninput="buscarSAP(this)" autocomplete="off">
<div class="autocomplete-box"></div>
</div>
</td>

<td>
<div class="input-container">
<input name="serial[]" oninput="buscarSerial(this)" onchange="consultarSerial(this)" autocomplete="off">
<div class="autocomplete-box"></div>
</div>
</td>

<td>
<input type="text" name="otp_actual[]" class="otp-actual" readonly>
</td>

<td>
<button type="button" class="btn-remove" onclick="eliminarFila(this)">X</button>
</td>
`
}

function eliminarFila(btn){
btn.closest("tr").remove()
}

async function buscarSAP(input){

let texto=input.value.trim()

let box=input.parentElement.querySelector(".autocomplete-box")

box.innerHTML=""

if(texto.length<1)return

let response=await fetch("/buscar_sap",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({sap:texto})
})

let data=await response.json()

data.saps.forEach(sap=>{

let div=document.createElement("div")
div.className="autocomplete-item"
div.innerText=sap

div.onclick=()=>{
input.value=sap
box.innerHTML=""
cargarSeriales(input)
}

box.appendChild(div)

})

}

async function cargarSeriales(input){

let sap=input.value.trim()

let fila=input.closest("tr")

let serialInput=fila.querySelector("input[name='serial[]']")

let box=serialInput.parentElement.querySelector(".autocomplete-box")

box.innerHTML=""

let response=await fetch("/buscar_seriales_sap",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({sap:sap})
})

let data=await response.json()

data.seriales.forEach(serial=>{

let div=document.createElement("div")
div.className="autocomplete-item"
div.innerText=serial

div.onclick=()=>{
serialInput.value=serial
box.innerHTML=""
consultarSerial(serialInput)
}

box.appendChild(div)

})

}

async function buscarSerial(input){

let serial=input.value.trim()

if(serial.length<1)return

let response=await fetch("/buscar_serial",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({serial:serial})
})

}

async function consultarSerial(input){

let serial=input.value.trim()

let response=await fetch("/buscar_serial",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({serial:serial})
})

let data=await response.json()

let fila=input.closest("tr")

if(data.existe){

fila.querySelector(".otp-actual").value=data.otp_actual
fila.classList.add("fila-ok")
fila.classList.remove("fila-error")

}else{

fila.querySelector(".otp-actual").value=""
fila.classList.add("fila-error")
fila.classList.remove("fila-ok")

}

}

function llenarCentro(){

let bodega=document.getElementById("bodega").value
let centro=document.getElementById("centro")

if(bodega==="BOGOTA")centro.value="C901"
else if(bodega==="CALI")centro.value="C902"
else if(bodega==="BARRANQUILLA")centro.value="C903"
else centro.value=""

}

</script>

</body>
</html>
